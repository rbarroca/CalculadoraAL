<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon_calculadora_al.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-head-->
    <meta name="keywords" content="calcular rendimento alojamento local, simulador AL Portugal, rentabilidade alojamento local, AL vs arrendamento, calculadora AL" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Open Graph e Twitter — injetados por página via react-helmet-async no SSG -->
    <!-- Fallback estático apenas para crawlers sem JS (redes sociais usam a versão pré-renderizada) -->
    <meta property="og:type" content="website" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preconnect for performance -->

    <style>
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #c2410c;
        color: white;
        padding: 8px 16px;
        text-decoration: none;
        border-radius: 0 0 4px 0;
        z-index: 100;
      }
      .skip-link:focus { top: 0; }
    </style>

    <!-- Google Analytics: só carrega depois de o visitante aceitar os cookies (window.loadGA) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-KVZD0XY5X4', { send_page_view: false });

      window.loadGA = function () {
        if (window.__gaLoaded) return;
        window.__gaLoaded = true;
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-KVZD0XY5X4';
        s.async = true;
        s.onload = function () { gtag('event', 'page_view'); };
        document.head.appendChild(s);
      };

      try {
        if (localStorage.getItem('al-cookie-consent') === 'granted') {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(window.loadGA, { timeout: 3000 });
          } else {
            window.addEventListener('load', window.loadGA);
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
